<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BASE FIELD Preview</title>
  <style>
    :root {
      color-scheme: light;
      --field: #0b6b3a;
      --grass: #14844d;
      --ink: #17231f;
      --muted: #65736e;
      --line: #d9e2dd;
      --paper: #f7faf8;
      --card: #ffffff;
      --gold: #c9942f;
      --red: #c94436;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background:
        linear-gradient(135deg, rgba(11, 107, 58, .12), transparent 42%),
        linear-gradient(180deg, #f0f6f2, #fbfcfb);
      color: var(--ink);
    }

    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 18px;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 22px;
    }

    .phone {
      position: sticky;
      top: 24px;
      height: 760px;
      border: 10px solid #17231f;
      border-radius: 38px;
      overflow: hidden;
      background: var(--paper);
      box-shadow: 0 24px 70px rgba(20, 36, 30, .22);
    }

    .status {
      height: 28px;
      background: #17231f;
    }

    .app {
      height: calc(100% - 28px);
      display: grid;
      grid-template-rows: 1fr 68px;
    }

    .screen {
      overflow: auto;
      padding: 18px 16px 24px;
    }

    .tabbar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, .94);
    }

    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      display: grid;
      place-items: center;
      gap: 2px;
      padding: 8px 0;
      cursor: pointer;
    }

    .tab.active { color: var(--field); }
    .tab span { font-size: 19px; line-height: 1; }

    h1, h2, h3, p { margin: 0; }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .brand {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
      color: var(--field);
      background: #fff;
    }

    .hero {
      background: linear-gradient(135deg, var(--field), #05341f);
      color: white;
      border-radius: 8px;
      padding: 18px;
      display: grid;
      gap: 14px;
      margin-bottom: 14px;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #fff, #d5f2df 38%, var(--gold) 39%, #7b5414);
      color: #17351f;
      display: grid;
      place-items: center;
      font-weight: 950;
    }

    .hero h2 {
      font-size: 23px;
      line-height: 1.08;
    }

    .hero small {
      color: rgba(255, 255, 255, .78);
      font-weight: 700;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 8px 26px rgba(33, 55, 45, .06);
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .stat-value {
      margin-top: 5px;
      font-size: 24px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .section-title {
      font-size: 16px;
      font-weight: 900;
      margin: 20px 0 10px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    .row:last-child { border-bottom: 0; }
    .muted { color: var(--muted); }
    .strong { font-weight: 900; }

    .button {
      border: 0;
      width: 100%;
      min-height: 48px;
      border-radius: 8px;
      background: var(--field);
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .button.secondary {
      background: #eef6f1;
      color: var(--field);
      border: 1px solid #cfe1d6;
    }

    .flow {
      display: grid;
      gap: 10px;
    }

    .flow button {
      text-align: left;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      font: inherit;
    }

    .scoreboard {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
    }

    .scoreboard th, .scoreboard td {
      padding: 7px 5px;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }

    .scoreboard th:first-child, .scoreboard td:first-child {
      text-align: left;
      font-weight: 900;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .key {
      min-height: 58px;
      border: 1px solid #cbd9d2;
      border-radius: 8px;
      background: white;
      font-size: 22px;
      font-weight: 950;
      cursor: pointer;
    }

    .big-prompt {
      text-align: center;
      padding: 18px 12px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid var(--line);
      margin-bottom: 12px;
    }

    .big-prompt .kicker {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .big-prompt .question {
      margin-top: 8px;
      font-size: 31px;
      font-weight: 950;
      line-height: 1.08;
    }

    .desktop {
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .panel {
      background: rgba(255, 255, 255, .82);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 12px 34px rgba(24, 48, 36, .08);
    }

    .panel h1 {
      font-size: 34px;
      line-height: 1.08;
      margin-bottom: 10px;
    }

    .panel p {
      color: var(--muted);
      line-height: 1.7;
    }

    .preview-nav {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .preview-nav button {
      min-height: 44px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      font-weight: 900;
      cursor: pointer;
    }

    .preview-nav button.active {
      background: var(--field);
      color: #fff;
      border-color: var(--field);
    }

    .legal-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin-top: 12px;
    }

    .legal-links a {
      color: var(--field);
      font-size: 13px;
      font-weight: 900;
      text-decoration: none;
    }

    .legal-links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      .phone { position: relative; top: auto; margin: 0 auto; width: min(100%, 390px); }
      .preview-nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="phone" aria-label="BASE FIELD app preview">
      <div class="status"></div>
      <div class="app">
        <div id="screen" class="screen"></div>
        <nav class="tabbar">
          <button class="tab active" data-screen="home"><span>⌂</span>ホーム</button>
          <button class="tab" data-screen="game"><span>●</span>試合</button>
          <button class="tab" data-screen="stats"><span>▦</span>成績</button>
          <button class="tab" data-screen="players"><span>♢</span>選手</button>
          <button class="tab" data-screen="settings"><span>⚙</span>設定</button>
        </nav>
      </div>
    </section>

    <section class="desktop">
      <div class="panel">
        <h1>BASE FIELD v1.0 Preview</h1>
        <p>Phase 1〜4までの体験を、ブラウザで触れる簡易プレビューにしました。左のスマホ画面でタブやフローを押して、試合後まとめ入力の流れを確認できます。</p>
      </div>
      <div class="panel">
        <h2 class="section-title" style="margin-top:0">クイック移動</h2>
        <div class="preview-nav">
          <button data-screen="home">ホーム</button>
          <button data-screen="game">試合フロー</button>
          <button data-screen="score">スコア入力</button>
          <button data-screen="batting">打者入力</button>
          <button data-screen="pitching">投手入力</button>
          <button data-screen="review">試合確認</button>
        </div>
      </div>
      <div class="panel">
        <h2 class="section-title" style="margin-top:0">今できること</h2>
        <p>チーム、シーズン、選手、試合作成、スコア入力、出場選手、打順、守備位置、打者・投手のステップ入力、試合確認、保存完了までをアプリ側に実装済みです。</p>
        <div class="legal-links">
          <a href="/privacy/">プライバシーポリシー</a>
          <a href="/terms/">利用規約</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    const state = {
      screen: "home",
      scoreStep: 0,
      battingStep: 0,
      pitchingStep: 0
    };

    const battingSteps = ["打席数", "打数", "安打", "打点", "得点", "2B", "3B", "HR", "三振", "四球", "死球", "盗塁", "犠打", "犠飛", "失策出塁 / FC", "得点圏打数", "得点圏安打", "守備時失策"];
    const pitchingSteps = ["投球回は？", "端数は？", "被安打", "失点", "自責点", "与四球", "与死球", "奪三振", "被本塁打", "対打者数", "投球数", "ボール数", "ストライク数", "勝敗/S"];

    const html = {
      home: () => `
        <div class="topline"><h1 class="brand">BASE FIELD</h1><span class="chip">2026</span></div>
        <section class="hero">
          <div class="team"><div class="logo">RH</div><div><h2>Royal Honeys</h2><small>2026シーズン</small></div></div>
          <div><strong>10勝 7敗 1分</strong><br><small>勝率 .588</small></div>
        </section>
        <div class="stats-grid">
          <div class="card"><div class="stat-label">チーム打率</div><div class="stat-value">.281</div></div>
          <div class="card"><div class="stat-label">OPS</div><div class="stat-value">.742</div></div>
          <div class="card"><div class="stat-label">防御率</div><div class="stat-value">3.21</div></div>
          <div class="card"><div class="stat-label">選手</div><div class="stat-value">12</div></div>
        </div>
        <h3 class="section-title">入力途中の試合</h3>
        <div class="card">
          <div class="row"><div><b>6/3 vs CSB兵庫</b><br><span class="muted">打者成績が未入力です</span></div></div>
          <button class="button" data-screen="game">続きから入力</button>
        </div>
        <h3 class="section-title">ランキング</h3>
        <div class="card">
          <div class="row"><span>打率 1位</span><b>長島 .333</b></div>
          <div class="row"><span>OPS 1位</span><b>山田 .912</b></div>
          <div class="row"><span>防御率 1位</span><b>佐藤 2.10</b></div>
        </div>
      `,
      game: () => `
        <div class="topline"><h1 class="brand">試合入力</h1><span class="chip">vs ボノボーズ</span></div>
        <div class="card">
          <h2 style="font-size:20px">5 - 3 勝利</h2>
          <p class="muted" style="margin-top:6px">2026/05/30 / 練習試合 / 先攻</p>
        </div>
        <h3 class="section-title">入力フロー</h3>
        <div class="flow">
          <button data-screen="score"><b>イニング別スコア入力</b><span>完了</span></button>
          <button><b>出場選手選択</b><span>完了</span></button>
          <button><b>打順設定</b><span>完了</span></button>
          <button><b>守備位置登録</b><span>完了</span></button>
          <button data-screen="batting"><b>打者成績入力</b><span>入力へ</span></button>
          <button data-screen="pitching"><b>投手成績入力</b><span>入力へ</span></button>
          <button data-screen="review"><b>試合確認</b><span>未保存</span></button>
        </div>
      `,
      score: () => `
        <div class="topline"><h1 class="brand">スコア入力</h1><span class="chip">自動送り</span></div>
        ${scoreTable()}
        <div class="big-prompt"><div class="kicker">現在の欄</div><div class="question">4回表<br>自チーム</div></div>
        <div class="keypad">${[1,2,3,4,5,6,7,8,9,"←",0,"10+"].map(v => `<button class="key">${v}</button>`).join("")}</div>
        <button class="button secondary" style="margin-top:12px">試合終了</button>
        <button class="button" data-screen="review" style="margin-top:10px">スコア確認へ</button>
      `,
      batting: () => {
        const step = battingSteps[state.battingStep % battingSteps.length];
        return `
          <div class="topline"><h1 class="brand">打者成績入力</h1><span class="chip">1 / 12人目</span></div>
          <div class="big-prompt"><div class="kicker">1番 長島 / 項目 ${state.battingStep + 1} / 18</div><div class="question">${step}は？</div></div>
          <div class="keypad">${[0,1,2,3,4,5,6,"＋"].map(v => `<button class="key" data-next-batting>${v}</button>`).join("")}</div>
          <button class="button secondary" style="margin-top:12px" data-prev-batting>戻る</button>
          <div class="card" style="margin-top:14px">
            <div class="row"><span>入力確認</span><b>2安打 1打点</b></div>
            <div class="row"><span>自動計算</span><b>OPS 1.750</b></div>
          </div>
        `;
      },
      pitching: () => {
        const step = pitchingSteps[state.pitchingStep % pitchingSteps.length];
        return `
          <div class="topline"><h1 class="brand">投手成績入力</h1><span class="chip">1 / 2人目</span></div>
          <div class="big-prompt"><div class="kicker">長島 / 項目 ${state.pitchingStep + 1} / 14</div><div class="question">${step}</div>${state.pitchingStep >= 9 && state.pitchingStep <= 12 ? `<p class="muted" style="margin-top:8px">この項目はスキップ可能です</p>` : ""}</div>
          <div class="keypad">${[0,1,2,3,4,5,6,7,"＋"].map(v => `<button class="key" data-next-pitching>${v}</button>`).join("")}</div>
          ${state.pitchingStep >= 9 && state.pitchingStep <= 12 ? `<button class="button secondary" style="margin-top:12px" data-next-pitching>未入力でスキップ</button>` : ""}
          <button class="button" data-screen="review" style="margin-top:12px">確認へ</button>
        `;
      },
      review: () => `
        <div class="topline"><h1 class="brand">試合確認</h1><span class="chip">保存前</span></div>
        <div class="card"><b>vs ボノボーズ</b><br><span class="muted">2026/05/30 / ほっともっとフィールド神戸</span></div>
        <h3 class="section-title">スコア</h3>${scoreTable()}
        <h3 class="section-title">打者成績</h3>
        <div class="card">
          <div class="row"><span>1 長島</span><b>3打数2安打 1打点</b></div>
          <div class="row"><span>2 山田</span><b>4打数1安打</b></div>
          <div class="row"><span>3 佐藤</span><b>3打数0安打 四球1</b></div>
        </div>
        <h3 class="section-title">チーム合計</h3>
        <div class="stats-grid">
          <div class="card"><div class="stat-label">打率</div><div class="stat-value">.281</div></div>
          <div class="card"><div class="stat-label">OPS</div><div class="stat-value">.806</div></div>
        </div>
        <h3 class="section-title">入力チェック</h3>
        <div class="card"><div class="row"><span>問題は見つかりませんでした</span><b>✓</b></div></div>
        <button class="button" data-screen="complete" style="margin-top:14px">保存する</button>
      `,
      complete: () => `
        <div class="topline"><h1 class="brand">保存完了</h1><span class="chip">完了</span></div>
        <section class="hero">
          <h2>vs ボノボーズ<br>5 - 3 勝利</h2>
          <small>試合結果と成績を保存しました。</small>
        </section>
        <h3 class="section-title">Today's Highlight</h3>
        <div class="card">
          <div class="row"><span>長島</span><b>2安打 1打点 / 勝利投手</b></div>
          <div class="row"><span>山田</span><b>3回1失点でセーブ</b></div>
        </div>
        <button class="button" data-screen="home" style="margin-top:14px">ホームへ</button>
      `,
      stats: () => `
        <div class="topline"><h1 class="brand">成績</h1><span class="chip">2026</span></div>
        <div class="card">
          <div class="row"><b>長島</b><span>AVG .333 / OPS .912</span></div>
          <div class="row"><b>山田</b><span>AVG .298 / OPS .801</span></div>
          <div class="row"><b>佐藤</b><span>ERA 2.10 / SO 18</span></div>
        </div>
      `,
      players: () => `
        <div class="topline"><h1 class="brand">選手</h1><span class="chip">12人</span></div>
        <div class="card">
          <div class="row"><b>#16 長島</b><span>SS / 3B / P</span></div>
          <div class="row"><b>#7 山田</b><span>CF</span></div>
          <div class="row"><b>#11 佐藤</b><span>C / 1B</span></div>
        </div>
      `,
      settings: () => `
        <div class="topline"><h1 class="brand">設定</h1><span class="chip">v1.0</span></div>
        <div class="card">
          <div class="row"><span>チーム設定</span><b>Royal Honeys</b></div>
          <div class="row"><span>防御率換算</span><b>7回制</b></div>
          <div class="row"><span>チーム共有</span><b>Supabase</b></div>
          <div class="row"><span>CSV出力</span><b>予定</b></div>
        </div>
      `
    };

    function scoreTable() {
      return `
        <table class="scoreboard">
          <thead><tr><th></th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>計</th></tr></thead>
          <tbody>
            <tr><td>RH</td><td>2</td><td>0</td><td>1</td><td>0</td><td>0</td><td>2</td><td>0</td><td><b>5</b></td></tr>
            <tr><td>相手</td><td>0</td><td>0</td><td>1</td><td>0</td><td>2</td><td>0</td><td>0</td><td><b>3</b></td></tr>
          </tbody>
        </table>
      `;
    }

    function render(screen = state.screen) {
      state.screen = screen;
      document.getElementById("screen").innerHTML = html[screen] ? html[screen]() : html.home();
      document.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("active", tab.dataset.screen === screen));
      document.querySelectorAll(".preview-nav button").forEach(button => button.classList.toggle("active", button.dataset.screen === screen));
    }

    document.addEventListener("click", event => {
      const target = event.target.closest("[data-screen], [data-next-batting], [data-prev-batting], [data-next-pitching]");
      if (!target) return;
      if (target.dataset.screen) render(target.dataset.screen);
      if (target.hasAttribute("data-next-batting")) {
        state.battingStep = (state.battingStep + 1) % battingSteps.length;
        render("batting");
      }
      if (target.hasAttribute("data-prev-batting")) {
        state.battingStep = Math.max(0, state.battingStep - 1);
        render("batting");
      }
      if (target.hasAttribute("data-next-pitching")) {
        state.pitchingStep = (state.pitchingStep + 1) % pitchingSteps.length;
        render("pitching");
      }
    });

    render();
  </script>
</body>
</html>
